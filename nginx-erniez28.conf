# erniez28.de — Nginx-Konfiguration (Referenz)
#
# Nur relevant, falls du Shell-/Config-Zugriff auf den Server hast
# (z.B. eigener VHost in /etc/nginx/sites-available/).
# Bei reinem Shared Hosting bitte stattdessen die .htaccess verwenden.
#
# Ziel: statische Auslieferung von index.html + /assets,
# /vq-link liefert die Startseite (URL bleibt erhalten, JS öffnet das Modal).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name erniez28.de www.erniez28.de;
    root /var/www/erniez28;          # Pfad zum Upload-Verzeichnis anpassen
    index index.html;

    charset utf-8;

    # ── /vq-link → index.html, ohne Redirect ─────────────────────
    # Der Pfad bleibt in der Adresszeile, das JS liest
    # window.location.pathname === '/vq-link' und öffnet das Modal.
    location = /vq-link {
        try_files /index.html =404;
    }
    location = /vq-link/ {
        try_files /index.html =404;
    }

    # ── Statische Assets mit langem Cache ────────────────────────
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Alles andere ─────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Sicherheits-Header ───────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Kompression ──────────────────────────────────────────────
    gzip on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SSL-Zertifikate (Let's Encrypt o.ä. — vorhandene Werte einsetzen)
    # ssl_certificate     /etc/letsencrypt/live/erniez28.de/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/erniez28.de/privkey.pem;
}

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name erniez28.de www.erniez28.de;
    return 301 https://erniez28.de$request_uri;
}
